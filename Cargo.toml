[package]
name = "remit-token22"
version = "0.1.0"
edition = "2021"
description = "Turbin3 Week 4: a remittance stablecoin on Token-2022, public (v1) and confidential (v2)"
license = "MIT"
publish = false

[dependencies]
solana-account = "5.0.0"
solana-clock = "4.0.0"
solana-instruction = "3.5.1"
solana-keypair = "4.0.0"
solana-program-test = { version = "4.4.1", features = ["agave-unstable-api"] }
solana-pubkey = "4.3.0"
solana-rent = "4.4.0"
solana-signer = "4.0.0"
solana-system-interface = "3.2.0"
solana-instruction-error = "3.0.0"
solana-transaction-error = "4.0.0"
solana-zk-sdk = "8.0.1"
solana-zk-sdk-pod = "0.1.2"
spl-token-2022-interface = { git = "https://github.com/solana-program/token-2022", rev = "1d91cfca9395a24adcdc453b38cb776d9624ff8e" }
spl-token-client = { git = "https://github.com/solana-program/token-2022", rev = "1d91cfca9395a24adcdc453b38cb776d9624ff8e", features = ["dev-context-only-utils"] }
spl-token-confidential-transfer-proof-generation = { git = "https://github.com/solana-program/token-2022", rev = "1d91cfca9395a24adcdc453b38cb776d9624ff8e" }
spl-associated-token-account-interface = "2.0.0"
spl-token-metadata-interface = "1.0.0"
spl-type-length-value = "0.9.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
bincode = "1.3.3"
solana-packet = "4.4.0"
solana-transaction = { version = "5.1.0", features = ["serde"] }

# Proof generation (curve25519, bulletproofs) is very slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
