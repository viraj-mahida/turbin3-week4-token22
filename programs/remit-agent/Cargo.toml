[package]
name = "remit-agent"
version = "0.1.0"
edition = "2021"
description = "Automation agent: moves tokens for a user through a delegated PDA (CPI into Token-2022)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-account-info = "3"
solana-cpi = "3"
solana-instruction = "3"
solana-msg = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = { version = "3", features = ["curve25519"] }

# Built on its own (cargo build-sbf), separate from the test crate.
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
